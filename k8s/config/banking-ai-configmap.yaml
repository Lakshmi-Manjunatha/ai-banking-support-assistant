apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-ai-config
  labels:
    app: banking-ai-config

data:
  DATABASE_HOST: "banking-postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "ai-banking_doc_support"

  DOC_CHUNK_TABLE_NAME: "bank_policy_langchain_doc_chunks"

  KEYCLOAK_ISSUER: "http://localhost:8180/realms/banking"
  KEYCLOAK_AUDIENCE: "banking-ai-api"
  JWKS_URL_SUFFIX: "/protocol/openid-connect/certs"
  KEYCLOAK_JWKS_URL: "http://host.docker.internal:8180/realms/banking/protocol/openid-connect/certs"

  NUMBER_OF_DOC_RETURN: "3"
  RETRIEVER_DOCUMENT_FETCH_LIMIT: "20"
  RETRIEVER_DOCUMENT_MAX_DISTANCE: "0.5"

  LOG_LEVEL: "INFO"
  LOG_TO_FILE: "false"
  LOG_FILE_PATH: "logs/app.log"
  LOG_FILE_MAX_BYTES: "10485760"
  LOG_FILE_BACKUP_COUNT: "5"

  BANK_POLICY_FILES_PATH: "/app/documents"
  EMBEDDING_DIMENSION: "768"

  CHUNK_SIZE: "500"
  CHUNK_OVERLAP: "100"
  BANK_POLICY_FILE_PATH: "/app/documents"

  GEMINI_LLM_MODEL_NAME: "gemini-2.5-flash"
  GEMINI_EMBEDDING_MODEL_NAME: "gemini-embedding-2"
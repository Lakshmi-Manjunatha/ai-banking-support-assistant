apiVersion: v1
kind: Pod
metadata:
  name: banking-documents-loader
  labels:
    app: banking-documents-loader

spec:
  restartPolicy: Never

  containers:
    - name: loader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]

      volumeMounts:
        - name: documents
          mountPath: /documents

  volumes:
    - name: documents
      persistentVolumeClaim:
        claimName: banking-documents-pvc

apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-service-deployment
  labels:
    app: ai-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-service

  template:
    metadata:
      labels:
        app: ai-service

    spec:
      containers:
        - name: ai-service
          image: ai-banking-service:1.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: banking-ai-config
            - secretRef:
                name: banking-ai-secret

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
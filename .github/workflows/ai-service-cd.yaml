
name: AI Service CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing Docker Hub image tag built by CI"
        required: true
        type: string

jobs:
  deploy-preview:
    runs-on: [self-hosted, Windows, X64]

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Verify Kubernetes cluster connection
      - name: Verify Kubernetes connection
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          kubectl config current-context
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          kubectl get nodes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Step 3: Replace placeholder with CI-built Docker image
      - name: Configure Docker image
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          $file = "k8s/overlays/preview/kustomization.yaml"

          $content = Get-Content -Path $file -Raw

          $content = $content.Replace(
            "placeholder/ai-banking-service",
            "${env:DOCKERHUB_USERNAME}/ai-banking-service"
          )

          $content = $content.Replace(
            "preview-placeholder",
            $env:IMAGE_TAG
          )

          Set-Content -Path $file -Value $content

          Write-Host "Generating preview Kubernetes manifests..."
          kubectl kustomize k8s/overlays/preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Step 4: Deploy application to preview namespace
      - name: Deploy to Kubernetes
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          kubectl apply -k k8s/overlays/preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          kubectl rollout status deployment/ai-service-deployment -n ai-service-preview --timeout=120s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Step 5: Verify deployed Kubernetes resources
      - name: Verify deployment
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          kubectl get deployments,pods,services -n ai-service-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
